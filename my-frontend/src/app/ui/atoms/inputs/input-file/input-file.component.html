<label class="c-file-input">
  <input
    type="file"
    (change)="onFileChange($event)"
    class="c-file-input__native"
    multiple
  />
  <div class="c-file-input__custom">
    <svg class="c-file-input__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
    </svg>
    <span class="c-file-input__text">Choose files</span>
  </div>
</label>

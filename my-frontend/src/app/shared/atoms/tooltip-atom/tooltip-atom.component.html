<span class="tooltip-container">
  <ng-content></ng-content>

  <span
    class="tooltip-box"
    [class.visible]="visible"
    [class.top]="position === 'top'"
    [class.bottom]="position === 'bottom'"
    [class.left]="position === 'left'"
    [class.right]="position === 'right'"
  >
    {{ text }}
  </span>
</span>

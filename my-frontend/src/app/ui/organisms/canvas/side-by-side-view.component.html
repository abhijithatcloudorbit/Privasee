<!-- ui/organisms/canvas/side-by-side-view.component.html -->
<div class="c-side-by-side-view">
  <div class="c-side-by-side-view__container" #container>
    <!-- Left side (original) -->
    <div class="c-side-by-side-view__left" [style.width.%]="splitPosition()">
      <canvas #leftCanvas class="c-side-by-side-view__canvas"></canvas>
      <div class="c-side-by-side-view__label">Original</div>
    </div>
    
    <!-- Slider -->
    <div class="c-side-by-side-view__slider" #slider (mousedown)="startDrag($event)">
      <div class="c-side-by-side-view__slider-handle"></div>
    </div>
    
    <!-- Right side (processed) -->
    <div class="c-side-by-side-view__right" [style.width.%]="100 - splitPosition()">
      <canvas #rightCanvas class="c-side-by-side-view__canvas"></canvas>
      <div class="c-side-by-side-view__label">Processed</div>
    </div>
  </div>
  
  <div class="c-side-by-side-view__controls">
    <button class="c-side-by-side-view__control-button" (click)="resetSplit()">
      Reset Split
    </button>
    <button class="c-side-by-side-view__control-button" (click)="toggleView()">
      {{ showOriginal() ? 'Hide' : 'Show' }} Original
    </button>
  </div>
</div>

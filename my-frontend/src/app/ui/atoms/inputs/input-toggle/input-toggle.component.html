<label class="c-toggle" [class.c-toggle--disabled]="disabled">
  <input 
    type="checkbox" 
    [checked]="checked"
    [disabled]="disabled"
    (change)="onToggle()"
    class="c-toggle__input">
  
  <div class="c-toggle__track" [class.c-toggle__track--checked]="checked">
    <div class="c-toggle__thumb"></div>
  </div>
  
  <span *ngIf="label" class="c-toggle__label">
    {{label}}
  </span>
</label>

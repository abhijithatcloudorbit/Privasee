<div class="tabs-wrapper">
  <!-- Tab Headers -->
  <div class="tab-headers">
    <button
      *ngFor="let tab of tabs; let i = index"
      class="tab-btn"
      [class.active]="i === activeIndex"
      [class.disabled]="tab.disabled"
      (click)="selectTab(i)"
      type="button"
    >
      {{ tab.label }}
    </button>
  </div>

  <!-- Active Content Slot -->
  <div class="tab-content">
    <ng-content select="[tabContent]"></ng-content>
  </div>
</div>

<!-- Show Image if available and not failed -->
<img
  *ngIf="src && !imageError"
  [src]="src"
  [alt]="alt"
  (error)="onError()"
  [ngStyle]="{
    width: size + 'px',
    height: size + 'px',
    borderRadius: borderRadius
  }"
/>

<!-- Fallback Initials -->
<div
  *ngIf="!src || imageError"
  class="fallback"
  [ngStyle]="{
    width: size + 'px',
    height: size + 'px',
    borderRadius: borderRadius,
    background: bg,
    color: color,
    fontSize: size * 0.4 + 'px'
  }"
>
  {{ initials ? initials.toUpperCase() : '?' }}
</div>

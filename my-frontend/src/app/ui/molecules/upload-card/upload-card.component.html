<div class="c-upload-card">
  <app-heading [level]="2" class="c-upload-card__title">Upload Images</app-heading>
  
  <app-text size="sm" color="muted" class="c-upload-card__description">
    Upload images for privacy filtering. Supports JPG, PNG, and WebP formats.
  </app-text>

  <div class="c-upload-card__dropzone">
    <app-input-file (fileSelected)="onFileSelected($event)"></app-input-file>
    
    <app-text size="sm" color="muted" class="c-upload-card__hint">
      or drag and drop files here
    </app-text>
  </div>

  <div *ngIf="selectedFiles.length > 0" class="c-upload-card__files">
    <app-text size="sm" class="c-upload-card__files-title">
      Selected files ({{ selectedFiles.length }})
    </app-text>
    <ul class="c-upload-card__file-list">
      <li *ngFor="let file of selectedFiles" class="c-upload-card__file-item">
        {{ file.name }} ({{ file.size | bytes }})
    </li>
    </ul>
  </div>

  <div class="c-upload-card__actions">
    <app-btn-primary (onClick)="onUpload()" [disabled]="selectedFiles.length === 0">
      Process Images
    </app-btn-primary>
  </div>
</div>

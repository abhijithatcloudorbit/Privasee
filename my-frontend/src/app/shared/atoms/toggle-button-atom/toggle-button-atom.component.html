<div 
  class="toggle-container"
  [class.disabled]="disabled"
  [style.--active-color]="color"
>
  <div 
    class="toggle-option"
    *ngFor="let option of options"
    [ngClass]="{ 'active': option.value === value, 'disabled': option.disabled }"
    (click)="onSelect(option)"
  >
    {{ option.label }}
  </div>
</div>

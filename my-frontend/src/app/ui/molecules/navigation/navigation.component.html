<!-- Navigation Container -->
<nav class="c-navigation" role="navigation" aria-label="Main navigation">
  
  <!-- Logo/Brand Area (optional) -->
  <div class="c-navigation__brand">
    <h1 class="c-navigation__title">AI Privacy Filter</h1>
    <span class="c-navigation__version">v1.0.0</span>
  </div>

  <!-- Main Navigation Tabs -->
  <div class="c-navigation__main">
    <app-nav-tabs
      [items]="navigationItems()"
      [initialPath]="currentPath()"
      (navChange)="handleNavigation($event)"
      [attr.aria-busy]="isLoading()">
    </app-nav-tabs>
  </div>

  <!-- Loading Indicator -->
  @if (isLoading()) {
    <div class="c-navigation__loading" aria-live="polite">
      <div class="c-navigation__loading-spinner"></div>
      <span class="c-navigation__loading-text">Loading...</span>
    </div>
  }

  <!-- Status/User Area (optional) -->
  <div class="c-navigation__status">
    <div class="c-navigation__progress">
      <span class="c-navigation__progress-label">Project Status:</span>
      <span class="c-navigation__progress-value">45% Complete</span>
    </div>
  </div>

</nav>

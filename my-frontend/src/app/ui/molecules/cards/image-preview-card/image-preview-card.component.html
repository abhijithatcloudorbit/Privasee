<div class="c-image-preview-card">
  <!-- Preview Image -->
  <div class="c-image-preview-card__image-container">
    <img
      *ngIf="imageUrl"
      [src]="imageUrl"
      [alt]="fileName"
      class="c-image-preview-card__image"
      (click)="preview.emit()">
    
    <div *ngIf="!imageUrl" class="c-image-preview-card__placeholder">
      🖼️
    </div>
    
    <!-- Status Badge -->
    <div class="c-image-preview-card__status">
      <app-badge [variant]="getStatusColor()" size="sm">
        {{status | titlecase}}
      </app-badge>
    </div>
    
    <!-- Progress Overlay -->
    <div *ngIf="status === 'processing'" class="c-image-preview-card__progress-overlay">
      <app-progress-bar
        [value]="progress"
        [max]="100"
        [showLabel]="true"
        variant="primary">
      </app-progress-bar>
    </div>
  </div>
  
  <!-- File Info -->
  <div class="c-image-preview-card__info">
    <div class="c-image-preview-card__header">
      <app-text-body size="md" weight="semibold" class="c-image-preview-card__filename">
        {{fileName}}
      </app-text-body>
      
      <button class="c-image-preview-card__remove" (click)="remove.emit()">
        ×
      </button>
    </div>
    
    <div class="c-image-preview-card__meta">
      <span class="c-image-preview-card__size">{{formatFileSize(fileSize)}}</span>
      <span *ngIf="dimensions" class="c-image-preview-card__dimensions">{{dimensions}}</span>
    </div>
    
    <!-- Detected Items -->
    <div *ngIf="detectedItems.length > 0" class="c-image-preview-card__detections">
      <div class="c-image-preview-card__detections-label">Detected:</div>
      <div class="c-image-preview-card__detection-tags">
        <app-badge
          *ngFor="let item of detectedItems"
          variant="primary"
          size="sm">
          {{item.type}} ({{item.count}})
        </app-badge>
      </div>
    </div>
  </div>
  
  <!-- Actions -->
  <div class="c-image-preview-card__actions">
    <app-btn-secondary size="sm" (click)="preview.emit()">
      Preview
    </app-btn-secondary>
    
    <app-btn-primary
      *ngIf="status === 'pending'"
      size="sm"
      (click)="process.emit()">
      Process
    </app-btn-primary>
    
    <app-btn-primary
      *ngIf="status === 'completed'"
      size="sm">
      Download
    </app-btn-primary>
  </div>
</div>

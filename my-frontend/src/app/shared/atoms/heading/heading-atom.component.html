<ng-container [ngSwitch]="level">
  <h1 *ngSwitchCase="1"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h1">
    <ng-content></ng-content>
  </h1>

  <h2 *ngSwitchCase="2"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h2">
    <ng-content></ng-content>
  </h2>

  <h3 *ngSwitchCase="3"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h3">
    <ng-content></ng-content>
  </h3>

  <h4 *ngSwitchCase="4"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h4">
    <ng-content></ng-content>
  </h4>

  <h5 *ngSwitchCase="5"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h5">
    <ng-content></ng-content>
  </h5>

  <h6 *ngSwitchCase="6"
      [ngStyle]="{ color, 'text-align': align, 'font-weight': weight }"
      class="heading h6">
    <ng-content></ng-content>
  </h6>
</ng-container>

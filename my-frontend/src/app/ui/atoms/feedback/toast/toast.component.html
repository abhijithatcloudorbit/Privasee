<div *ngIf="visible" class="c-toast" [class]="'c-toast--' + type">
  <div class="c-toast__icon">
    {{icon}}
  </div>
  
  <div class="c-toast__content">
    <div *ngIf="title" class="c-toast__title">
      {{title}}
    </div>
    <div class="c-toast__message">
      {{message}}
    </div>
  </div>
  
  <button *ngIf="dismissible" class="c-toast__close" (click)="close()">
    ×
  </button>
</div>
